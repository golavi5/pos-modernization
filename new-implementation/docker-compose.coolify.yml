# ── Despliegue en Coolify (stack completo, un solo recurso) ───────────────────
#
# Este archivo es para PRODUCCIÓN en Coolify. Para desarrollo local usá
# `docker-compose.yml`, que es otra cosa: publica puertos en el host, lee
# `backend/.env` y hornea `NEXT_PUBLIC_API_URL=http://127.0.0.1:3000`.
# Desplegar aquel archivo tal cual rompe el frontend (el navegador llamaría a
# 127.0.0.1) y deja MySQL expuesto en el host.
#
# Diferencias deliberadas con el compose de desarrollo:
#   · MySQL NO publica puertos     → sólo alcanzable por la red interna del stack
#   · nadie publica puertos        → el proxy de Coolify enruta por la red
#   · sin `container_name`         → Coolify nombra los contenedores
#   · sin `env_file`               → las variables las inyecta Coolify
#   · `${VAR:?}` en los secretos   → el deploy falla si falta, en vez de arrancar mal
#
# Coolify auto-detecta cada `${VARIABLE}` de este archivo y la ofrece en la
# pestaña Environment Variables del recurso. Ver DEPLOYMENT-COOLIFY.md.
#
# ⚠️ DOS COSAS VERIFICADAS CONTRA DESPLIEGUES REALES:
#
# 1. Los `context:` son relativos a ESTE archivo (`./backend`, `./frontend`), y
#    eso EXIGE que el "Base directory" del recurso sea `/new-implementation`.
#    Coolify lo usa como `--project-directory`, y Compose resuelve las rutas
#    relativas contra el project-directory, no contra la ubicación del archivo.
#      Base directory = /                    → busca <raíz>/backend                    ✗
#      Base directory = /new-implementation  → busca <raíz>/new-implementation/backend ✓
#    No "arregles" esto poniéndole el prefijo `./new-implementation/`: con el
#    Base directory correcto queda duplicado y falla igual —
#      path "/artifacts/<id>/new-implementation/new-implementation/backend" not found
#
# 2. Los `environment:` van en formato MAPA (`CLAVE: valor`), nunca en lista
#    (`- CLAVE=valor`). Coolify reprocesa ese bloque y una secuencia le llega con
#    claves enteras:
#      Error: non-string key in services.frontend.environment: 0
#    Por eso tampoco se usan las variables mágicas `SERVICE_FQDN_*`: se escriben
#    como nombre suelto y obligan al formato lista. Los dominios se asignan
#    desde la UI de Coolify.

services:
  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?falta MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-pos_db}
      MYSQL_USER: ${DB_USERNAME:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Sin `ports:` a propósito. Publicar aquí saltaría el proxy y dejaría la base
    # accesible desde fuera del VPS — es el gate "MySQL port-not-exposed" de
    # SPEC-CUT-002 §2. El backend la alcanza por el nombre de servicio `mysql`.
    healthcheck:
      # `$$` = un `$` literal para el shell del contenedor: la contraseña se lee
      # del entorno del propio MySQL, no se interpola en el compose renderizado
      # (así no aparece en `docker inspect` ni sufre problemas de comillas).
      # `-h 127.0.0.1` fuerza TCP a propósito: durante la inicialización del
      # datadir, MySQL levanta un servidor temporal que NO escucha en TCP, así
      # que esto reporta "no listo" en vez de dar un falso verde por el socket.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      # Ventana amplia PARA EL PRIMER ARRANQUE: con el volumen vacío, MySQL 8
      # inicializa el datadir antes de aceptar conexiones, y en un VPS modesto
      # eso pasa del minuto. Con start_period 30s + 5 reintentos (~80s) el deploy
      # moría en 71s con "dependency failed to start: container mysql is
      # unhealthy". Ahora la ventana es ~220s; los arranques posteriores siguen
      # marcando healthy en el primer intento, así que no cuesta nada.
      retries: 10
      start_period: 120s

  # ── Backend (NestJS) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # Formato MAPA, no lista. Coolify reprocesa este bloque y una secuencia le
    # llega con claves enteras: `non-string key in services.<svc>.environment: 0`.
    #
    # NODE_ENV NO va acá: la etapa `production` del Dockerfile ya la fija
    # (`ENV NODE_ENV=production`). Declararla aquí hace que Coolify la registre
    # como variable del recurso, la inyecte como `ARG NODE_ENV` en el build y
    # rompa `npm ci` — y además impide borrarla desde la UI ("Cannot delete
    # environment variable 'NODE_ENV': remove it from the Docker Compose file
    # first").
    environment:
      PORT: "3000"
      # La base vive en el mismo stack: se resuelve por nombre de servicio.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-pos_user}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pos_db}
      # El esquema lo crean las migraciones TypeORM al arrancar.
      DB_RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Origen del frontend. Sin esto el backend NO arranca en producción.
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS}
      # Primer admin: sin estas dos, la base queda sin usuarios y nadie entra.
      # No rompen el arranque si faltan — de ahí el `:?`, que sí lo hace.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?falta BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?falta BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-Mi Empresa}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    # Publicado SÓLO en la interfaz de loopback del host, para que `cloudflared`
    # pueda apuntar directo aquí sin pasar por el proxy de Coolify. Al ir atado a
    # 127.0.0.1 NO queda expuesto a Internet: `nc -zv <IP-del-VPS> 3002` falla.
    # Si cloudflared corre en un contenedor (no como servicio del host), 127.0.0.1
    # es el loopback DE ESE contenedor y no llega: en ese caso hay que exponerlo
    # en la IP del bridge de docker y filtrar con firewall.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3002}:3000"
    healthcheck:
      # Liveness: no toca la base, para que un parpadeo de MySQL no reinicie el
      # backend. La readiness (`/health/ready`) es para monitoreo, no para esto.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 10s
      # En el PRIMER arranque este contenedor aplica las migraciones TypeORM y
      # crea el admin antes de escuchar. 40s no alcanzaba.
      retries: 6
      start_period: 90s

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # CRÍTICO: Next.js hornea los NEXT_PUBLIC_* en el bundle EN EL BUILD.
        # Tiene que ser la URL pública del backend (https://api.tu-dominio.com),
        # porque quien hace la llamada es el navegador del usuario, no el
        # contenedor: `http://backend:3000` aquí NO funciona.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?falta NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    # Sin bloque `environment`: todo lo que este servicio necesita en runtime ya
    # está en su imagen (`ENV NODE_ENV=production`, `HOSTNAME=0.0.0.0`,
    # `PORT=3000`), y `NEXT_PUBLIC_API_URL` se horneó en el build. Declarar
    # NODE_ENV acá la convertiría en variable gestionada por Coolify, que la
    # inyecta como ARG en el build y rompe `npm ci` — ver la nota del backend.
    # El contenedor escucha en 3000; el dominio se asigna desde la UI.
    # Ver la nota del backend sobre por qué se publica en 127.0.0.1.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

volumes:
  mysql_data:
    driver: local
