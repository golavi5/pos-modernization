# ── Para desarrollo local ──────────────────────────────────────────────────────
# Setup (una vez, antes de `docker compose up -d`):
#   1. cp .env.example .env   → credenciales MYSQL_* del contenedor MySQL
#      (.env está gitignored; nunca subas secretos reales).
#   2. cp backend/.env.example backend/.env
#      → rellena DB_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, CORS_ORIGINS
#        (el backend corre en NODE_ENV=production y FALLA si quedan en CHANGE_ME).
#        Genera secretos: openssl rand -base64 48
#      → rellena BOOTSTRAP_ADMIN_EMAIL/PASSWORD (min 12) para crear el primer
#        admin en la base vacía — si no, nadie puede iniciar sesión.
#   3. cp frontend/.env.local.example frontend/.env.local   (opcional)
#   4. docker compose up -d
#
# Puertos del host (sólo desarrollo). Si alguno está ocupado en tu máquina,
# exportá la variable correspondiente antes de `up` — el puerto DENTRO del
# contenedor no cambia, así que no hay que tocar Dockerfiles ni healthchecks:
#   MYSQL_HOST_PORT     (def. 3308)
#   BACKEND_HOST_PORT   (def. 3000)
#   FRONTEND_HOST_PORT  (def. 3001)
#
# En Coolify NO se usa este archivo: se despliega el stack completo desde
# docker-compose.coolify.yml, que no publica ningún puerto (ver
# DEPLOYMENT-COOLIFY.md).

services:
  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Puerto del host configurable: si 3308 ya está tomado en tu máquina,
      # exportá MYSQL_HOST_PORT=<otro> (o ponelo en .env) antes de `up`.
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Schema is owned by TypeORM migrations (the backend runs them on boot via
      # DB_RUN_MIGRATIONS=true below), NOT a preloaded SQL dump. database/schema.sql
      # is historical/divergent — see SPEC-CUT-001 B-05.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pos_backend
    restart: unless-stopped
    env_file:
      # Create from backend/.env.example (see header). Non-fatal if absent so
      # `docker compose up` doesn't hard-error — the backend then fails fast with
      # a clear "missing production env vars" message instead.
      - path: ./backend/.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_RUN_MIGRATIONS: "true"
    ports:
      # Puerto del host configurable: si 3000 ya está tomado, exportá
      # BACKEND_HOST_PORT=<otro> antes de `up`. El contenedor sigue en 3000, así
      # que el healthcheck de abajo no cambia.
      - "${BACKEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
    container_name: pos_frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # Optional — NEXT_PUBLIC_API_URL is baked at build time via the build arg
      # above, so the frontend runs without this file.
      - path: ./frontend/.env.local
        required: false
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      # Igual que el backend: FRONTEND_HOST_PORT cambia sólo el puerto del host.
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
