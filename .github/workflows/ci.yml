name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Gates PRs on backend unit tests + build and frontend build (Next build runs the
# TS typecheck). Node 20 matches the Dockerfiles. Both apps now ship an ESLint
# config, and the `lint` job runs each app's `lint:ci` plus the backend's
# no-explicit-any budget. That job GATES: "Lint — backend + frontend" is in
# main's required_status_checks.contexts as of 2026-08-10, added only after it
# had reported green on real runners — a required check that has never reported
# wedges every PR. See SPEC-BACK-002 §4.
#
# NOTE: this file must live at the REPO ROOT (.github/workflows/). The previous
# workflow sat under new-implementation/.github/ and therefore never ran.
jobs:
  backend:
    name: Backend — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./new-implementation/backend
    # Throwaway MySQL for `npm run test:e2e` (the payment/refund lock races,
    # SPEC-BACK-003). Credentials and port are the ones hard-coded in
    # test/payments-lock.e2e-spec.ts, which drops its schema on connect.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: locktest
          MYSQL_DATABASE: pos_lock_test
        ports:
          - 3319:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocktest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: new-implementation/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./new-implementation/frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: new-implementation/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  i18n:
    name: Frontend — i18n checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./new-implementation/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/smoke/i18n-parity.cjs
      - run: node scripts/smoke/i18n-lint.cjs

  lint:
    name: Lint — backend + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            new-implementation/backend/package-lock.json
            new-implementation/frontend/package-lock.json
      - name: Backend
        working-directory: ./new-implementation/backend
        run: |
          npm ci
          npm run lint:ci
          npm run lint:budget
      - name: Frontend
        working-directory: ./new-implementation/frontend
        run: |
          npm ci
          npm run lint:ci

  e2e:
    name: E2E — Playwright (maintained specs)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Re-enabled 2026-11-09 for the specs that pass against a clean stack
    # (command-palette, panel-hydration-failure, sale-flow, sidebar-reachability).
    # NOT a required check, and `continue-on-error` stays on until it has been
    # green on a few runs — see SPEC-BACK-002's note on required checks that have
    # never reported. The older specs (auth, customers, inventory, products,
    # sales) assert stale selectors/routes and are not run here; they need a
    # rewrite, not a re-enable.
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: ./new-implementation/backend
        run: npm ci

      - name: Install frontend deps
        working-directory: ./new-implementation/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./new-implementation/frontend
        run: npx playwright install --with-deps chromium

      # Backend on :3001 (migrations + admin bootstrap on boot). The admin is the
      # one tests/e2e/helpers/auth.helper.ts logs in as by default.
      - name: Build + start backend (:3001)
        working-directory: ./new-implementation/backend
        env:
          NODE_ENV: production
          PORT: '3001'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_NAME: pos_test
          DB_RUN_MIGRATIONS: 'true'
          JWT_SECRET: ci-test-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_REFRESH_SECRET: ci-test-refresh-secret-bbbbbbbbbbbbbbbbbbbb
          CORS_ORIGINS: http://localhost:3000
          BOOTSTRAP_ADMIN_EMAIL: admin@test.com
          BOOTSTRAP_ADMIN_PASSWORD: Fddm1ZDKTv3RbDpU
        run: |
          npm run build
          node dist/main.js &
          npx wait-on http://localhost:3001/health -t 60000

      # Production build, not `next dev`: no on-demand compile, so tests never
      # race a cold page. NEXT_PUBLIC_API_URL is baked in at build time.
      - name: Build + start frontend (:3000)
        working-directory: ./new-implementation/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          npm run build
          npx next start -p 3000 &
          npx wait-on http://localhost:3000/login -t 60000

      # sale-flow needs a sellable product in the catalog (a fresh database has
      # none). Same admin the bootstrap step created.
      - name: Seed one product
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:3001/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@test.com","password":"Fddm1ZDKTv3RbDpU"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).accessToken')
          curl -sf -X POST http://localhost:3001/products \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"E2E Cafe","sku":"E2E-CAFE","price":10000,"stock_quantity":100,"tax_rate":19}'

      - name: Run E2E (frontend :3000 → API :3001)
        working-directory: ./new-implementation/frontend
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
        run: >-
          npx playwright test --project=chromium
          tests/e2e/command-palette.spec.ts
          tests/e2e/panel-hydration-failure.spec.ts
          tests/e2e/sale-flow.spec.ts
          tests/e2e/sidebar-reachability.spec.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: new-implementation/frontend/playwright-report/
          retention-days: 30
